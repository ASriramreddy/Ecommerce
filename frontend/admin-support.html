<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Support Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

.header {
    background: #111827;
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header button {
    border: 0;
    background: #ef4444;
    color: white;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.container {
    max-width: 1400px;
    margin: 25px auto;
    padding: 0 18px;
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 22px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat h3 {
    margin: 0 0 8px;
    font-size: 14px;
    color: #6b7280;
}

.stat strong {
    font-size: 28px;
}

.ticket-breakdown-card {
    width: 100%;
    border: 0;
    padding: 20px;
    border-radius: 12px;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    color: #1f2937;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: box-shadow .2s ease, transform .2s ease;
}

.ticket-breakdown-card:hover {
    box-shadow: 0 8px 20px rgba(0,0,0,.1);
    transform: translateY(-2px);
}

.ticket-breakdown-card:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 3px;
}

.ticket-breakdown-card[aria-pressed="true"] {
    box-shadow: 0 0 0 2px #2563eb, 0 8px 20px rgba(37, 99, 235, .14);
}

.ticket-breakdown-card .stat-label {
    display: block;
    margin: 0 0 8px;
    color: #6b7280;
    font-size: 14px;
    font-weight: 600;
}

.ticket-breakdown-hint {
    display: block;
    margin-top: 6px;
    color: #2563eb;
    font-size: 12px;
    font-weight: 600;
}

.ticket-breakdown-modal {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: none;
    place-items: center;
    padding: 20px;
}

.ticket-breakdown-modal.open {
    display: grid;
    animation: ticketBreakdownFadeIn .2s ease;
}

.ticket-breakdown-overlay {
    position: absolute;
    inset: 0;
    background: rgba(17, 24, 39, .58);
}

.ticket-breakdown-dialog {
    position: relative;
    width: min(100%, 560px);
    max-height: min(720px, calc(100vh - 40px));
    overflow-y: auto;
    border-radius: 16px;
    background: white;
    box-shadow: 0 24px 70px rgba(0,0,0,.24);
    animation: ticketBreakdownPop .25s ease;
}

.ticket-breakdown-header {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 24px 24px 18px;
    border-bottom: 1px solid #e5e7eb;
}

.ticket-breakdown-title {
    margin: 0;
    color: #6b7280;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
}

.ticket-breakdown-total {
    display: block;
    margin-top: 5px;
    color: #1f2937;
    font-size: 34px;
    line-height: 1.1;
}

.ticket-breakdown-total-label {
    display: block;
    margin-top: 3px;
    color: #6b7280;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.2;
    text-transform: none;
    letter-spacing: 0;
}

.ticket-breakdown-close {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 8px;
    background: #f3f4f6;
    color: #4b5563;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
}

.ticket-breakdown-close:hover {
    background: #e5e7eb;
    color: #111827;
}

.ticket-breakdown-close:focus-visible,
.ticket-breakdown-row:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}

.ticket-breakdown-list {
    padding: 12px 24px 24px;
}

.ticket-breakdown-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 15px 0;
    border-bottom: 1px solid #e5e7eb;
}

.ticket-breakdown-row:last-child {
    border-bottom: 0;
}

.ticket-breakdown-label {
    color: #374151;
    font-size: 15px;
    font-weight: 600;
}

.ticket-breakdown-count {
    min-width: 42px;
    color: #2563eb;
    font-size: 20px;
    font-weight: 700;
    text-align: right;
}

.ticket-breakdown-bar {
    grid-column: 1 / -1;
    height: 5px;
    overflow: hidden;
    border-radius: 999px;
    background: #e5e7eb;
}

.ticket-breakdown-bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: #2563eb;
}

.ticket-breakdown-empty {
    padding: 28px 0 18px;
    color: #6b7280;
    text-align: center;
}

@keyframes ticketBreakdownFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes ticketBreakdownPop {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

body.modal-open {
    overflow: hidden;
}

/* FILTER */

.toolbar {
    background: white;
    padding: 15px;
    border-radius: 12px;
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.toolbar input,
.toolbar select {
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
}

.toolbar input {
    flex: 1;
    min-width: 200px;
}

.toolbar button {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 10px 17px;
    border-radius: 7px;
    cursor: pointer;
}

/* LAYOUT */

.dashboard {
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 18px;
}

.tickets {
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

.ticket-list {
    max-height: 650px;
    overflow-y: auto;
}

.ticket {
    padding: 16px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.ticket:hover,
.ticket.active {
    background: #eff6ff;
}

.ticket-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.ticket-name {
    font-weight: bold;
}

    .ticket-email {
        color: #6b7280;
        font-size: 13px;
        margin-top: 4px;
    }

    .ticket-order {
        color: #4b5563;
        font-size: 13px;
        margin-top: 2px;
    }

.ticket-message {
    margin-top: 8px;
    font-size: 14px;
    color: #374151;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.badge {
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    white-space: nowrap;
}

.open {
    background: #fee2e2;
    color: #991b1b;
}

.in_progress {
    background: #fef3c7;
    color: #92400e;
}

.resolved {
    background: #dcfce7;
    color: #166534;
}

.closed {
    background: #e5e7eb;
    color: #374151;
}

/* CONVERSATION */

.conversation {
    background: white;
    border-radius: 12px;
    min-height: 650px;
    display: flex;
    flex-direction: column;
}

.conversation-header {
    padding: 18px;
    border-bottom: 1px solid #eee;
}

.conversation-header h2 {
    margin: 0 0 8px;
}

.customer-info {
    color: #6b7280;
    font-size: 14px;
}

.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    max-height: 440px;
}

.message {
    max-width: 75%;
    padding: 12px 15px;
    margin-bottom: 12px;
    border-radius: 12px;
}

.customer {
    background: #f3f4f6;
    margin-right: auto;
}

.admin {
    background: #dbeafe;
    margin-left: auto;
}

.message-label {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 5px;
}

.message-time {
    font-size: 10px;
    color: #6b7280;
    margin-top: 5px;
}

/* REPLY */

.reply-box {
    padding: 15px;
    border-top: 1px solid #eee;
}

.reply-box textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

.reply-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.reply-actions select,
.reply-actions button {
    padding: 10px 14px;
    border-radius: 7px;
    border: 1px solid #d1d5db;
}

.reply-actions button {
    background: #2563eb;
    color: white;
    border: 0;
    cursor: pointer;
}

.empty {
    padding: 40px;
    text-align: center;
    color: #6b7280;
}

/* MOBILE */

@media (max-width: 800px) {

    .header {
        padding: 14px;
    }

    .header h1 {
        font-size: 18px;
    }

    .container {
        padding: 0 10px;
        margin-top: 15px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard {
        grid-template-columns: 1fr;
    }

    .ticket-list {
        max-height: 400px;
    }

    .conversation {
        min-height: 600px;
    }

    .message {
        max-width: 90%;
    }

    .ticket-breakdown-modal {
        padding: 12px;
        align-items: end;
    }

    .ticket-breakdown-dialog {
        max-height: calc(100vh - 24px);
        border-radius: 16px 16px 12px 12px;
    }

    .ticket-breakdown-header {
        gap: 12px;
        padding: 20px;
    }

    .ticket-breakdown-total {
        font-size: 30px;
    }

    .ticket-breakdown-list {
        padding: 4px 20px 20px;
    }

    .ticket-breakdown-row {
        gap: 12px;
        padding: 13px 0;
    }

    .ticket-breakdown-label {
        font-size: 14px;
    }

    .ticket-breakdown-count {
        font-size: 18px;
    }

    .reply-actions {
        flex-direction: column;
    }

    .reply-actions select,
    .reply-actions button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🎧 Customer Support Dashboard</h1>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="stats">
        <button
            class="stat ticket-breakdown-card"
            type="button"
            data-ticket-status="all"
            aria-haspopup="dialog"
            aria-controls="ticketBreakdownModal"
            aria-pressed="true"
            aria-label="View total ticket category breakdown"
            onclick="openTicketBreakdown()"
        >
            <span class="stat-label">Total Tickets</span>
            <strong id="totalTickets">0</strong>
            <span class="ticket-breakdown-hint">View category breakdown</span>
        </button>

        <button
            class="stat ticket-breakdown-card"
            type="button"
            data-ticket-status="open"
            aria-haspopup="dialog"
            aria-controls="ticketBreakdownModal"
            aria-pressed="false"
            aria-label="View open ticket category breakdown"
            onclick="openTicketBreakdown('open')"
        >
            <span class="stat-label">Open</span>
            <strong id="openTickets">0</strong>
            <span class="ticket-breakdown-hint">View open ticket breakdown</span>
        </button>

        <button
            class="stat ticket-breakdown-card"
            type="button"
            data-ticket-status="in_progress"
            aria-haspopup="dialog"
            aria-controls="ticketBreakdownModal"
            aria-pressed="false"
            aria-label="View in-progress ticket category breakdown"
            onclick="openTicketBreakdown('in_progress')"
        >
            <span class="stat-label">In Progress</span>
            <strong id="progressTickets">0</strong>
            <span class="ticket-breakdown-hint">View in-progress breakdown</span>
        </button>

        <button
            class="stat ticket-breakdown-card"
            type="button"
            data-ticket-status="resolved"
            aria-haspopup="dialog"
            aria-controls="ticketBreakdownModal"
            aria-pressed="false"
            aria-label="View resolved ticket category breakdown"
            onclick="openTicketBreakdown('resolved')"
        >
            <span class="stat-label">Resolved</span>
            <strong id="resolvedTickets">0</strong>
            <span class="ticket-breakdown-hint">View resolved breakdown</span>
        </button>
    </div>

    <div class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="Search customer, email or ticket..."
            oninput="filterTickets()"
        >

        <select id="statusFilter" onchange="loadTickets()">
            <option value="">All Status</option>
            <option value="open">Open</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
        </select>

        <button onclick="loadTickets()">Refresh</button>

    </div>

    <div class="dashboard">

        <div class="tickets">

            <div class="ticket-list" id="ticketList">
                <div class="empty">Loading tickets...</div>
            </div>

        </div>

        <div class="conversation">

            <div id="conversationContent">

                <div class="empty">
                    Select a support ticket to view the conversation.
                </div>

            </div>

        </div>

    </div>

</div>

<div
    class="ticket-breakdown-modal"
    id="ticketBreakdownModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ticketBreakdownTitle"
    aria-hidden="true"
>
    <div class="ticket-breakdown-overlay" onclick="closeTicketBreakdown()"></div>
    <section class="ticket-breakdown-dialog">
        <div class="ticket-breakdown-header">
            <div>
                <p class="ticket-breakdown-title" id="ticketBreakdownTitle">Ticket Breakdown</p>
                <strong class="ticket-breakdown-total">
                    <span id="breakdownTotal">0</span>
                    <span class="ticket-breakdown-total-label" id="breakdownTotalLabel">Total Tickets</span>
                </strong>
            </div>
            <button
                class="ticket-breakdown-close"
                type="button"
                aria-label="Close ticket breakdown"
                onclick="closeTicketBreakdown()"
            >
                &times;
            </button>
        </div>
        <div class="ticket-breakdown-list" id="ticketBreakdownList"></div>
    </section>
</div>

<script>

/*
====================================================
CHANGE THIS TO YOUR RENDER BACKEND URL
====================================================
*/

const API_BASE = "https://ecommerce-1-r5m4.onrender.com";
const API = API_BASE;


let tickets = [];
let selectedTicket = null;
let ticketBreakdownTrigger = null;
let activeTicketStatus = "all";

const ticketStatusLabels = {
    all: "Total Tickets",
    open: "Open Tickets",
    in_progress: "In Progress Tickets",
    resolved: "Resolved Tickets"
};

const ticketCategories = [
    { value: "order", label: "Order Issues" },
    { value: "delivery", label: "Delivery Issues" },
    { value: "return", label: "Returns & Refunds" },
    { value: "product", label: "Product Issues" },
    { value: "coupon", label: "Coupon/Offers" },
];


/* ADMIN TOKEN */

function getToken() {

    return (
        localStorage.getItem("sriram-admin-token") ||
        localStorage.getItem("adminToken") ||
        localStorage.getItem("admin_token") ||
        sessionStorage.getItem("adminToken")
    );

}


/* apiRequest(...) REQUEST */

async function apiRequest(url, options = {}) {

    const token = getToken();

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (token) {
        headers.Authorization = `Bearer ${token}`;
    }

    const response = await fetch(API_BASE + url, {
        ...options,
        headers
    });

    if (response.status === 401) {
        alert("Admin session expired. Please login again.");
        logout();
        return null;
    }

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(data.error || "Request failed");
    }

    return data;
}


/* LOAD TICKETS */

async function loadTickets() {

    try {

        const url = `/admin/support`;

        const data = await apiRequest(url);

        if (!data) return;

        tickets = Array.isArray(data) ? data : [];
        activeTicketStatus =
            document.getElementById("statusFilter").value || "all";
        syncTicketStatusCards();

        updateStats();
        renderTickets();

    } catch (error) {

        console.error(error);

        document.getElementById("ticketList").innerHTML =
            `<div class="empty">
                Could not load support tickets.<br>
                ${error.message}
            </div>`;
    }
}


/* STATISTICS */

function updateStats() {

    document.getElementById("totalTickets").textContent =
        tickets.length;

    document.getElementById("openTickets").textContent =
        tickets.filter(t => t.status === "open").length;

    document.getElementById("progressTickets").textContent =
        tickets.filter(t => t.status === "in_progress").length;

    document.getElementById("resolvedTickets").textContent =
        tickets.filter(t => t.status === "resolved").length;

    if (document.getElementById("ticketBreakdownModal").classList.contains("open")) {
        renderTicketBreakdown();
    }
}


function getTicketsForBreakdown() {

    if (activeTicketStatus === "all") {
        return tickets;
    }

    return tickets.filter(ticket => ticket.status === activeTicketStatus);
}


function normalizeTicketCategory(category) {

    const value = String(category || "")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    if ([
        "order",
        "order issue",
        "order issues"
    ].includes(value)) {
        return "order";
    }

    if ([
        "delivery",
        "delivery issue",
        "delivery issues"
    ].includes(value)) {
        return "delivery";
    }

    if ([
        "return",
        "returns",
        "refund",
        "refunds",
        "return refund",
        "returns refund",
        "return refunds",
        "returns refunds"
    ].includes(value)) {
        return "return";
    }

    if ([
        "product",
        "product issue",
        "product issues",
        "product quality"
    ].includes(value)) {
        return "product";
    }

    if ([
        "coupon",
        "coupons",
        "offer",
        "offers",
        "coupon offer",
        "coupon offers",
        "coupons offers"
    ].includes(value)) {
        return "coupon";
    }

    return "";
}


function getTicketBreakdown() {

    const breakdownTickets = getTicketsForBreakdown();
    const counts = Object.fromEntries(
        ticketCategories.map(category => [category.value, 0])
    );

    breakdownTickets.forEach(ticket => {
        const category = normalizeTicketCategory(ticket.category);

        if (counts[category] !== undefined) {
            counts[category] += 1;
        }
    });

    return ticketCategories.map(category => ({
        ...category,
        count: counts[category.value]
    }));
}


function renderTicketBreakdown() {

    const breakdown = getTicketBreakdown();
    const breakdownTickets = getTicketsForBreakdown();
    const total = breakdownTickets.length;
    const list = document.getElementById("ticketBreakdownList");
    const statusLabel =
        ticketStatusLabels[activeTicketStatus] ||
        ticketStatusLabels.all;

    document.getElementById("ticketBreakdownTitle").textContent =
        statusLabel;
    document.getElementById("breakdownTotal").textContent = total;
    document.getElementById("breakdownTotalLabel").textContent =
        statusLabel;

    list.innerHTML = breakdown.map(category => {
        const width = total
            ? Math.round((category.count / total) * 100)
            : 0;

        return `
            <div class="ticket-breakdown-row">
                <span class="ticket-breakdown-label">
                    ${escapeHtml(category.label)}
                </span>
                <strong class="ticket-breakdown-count">
                    ${category.count}
                </strong>
                <div class="ticket-breakdown-bar" aria-hidden="true">
                    <span style="width: ${width}%"></span>
                </div>
            </div>
        `;
    }).join("");
}


function syncTicketStatusCards() {

    document.querySelectorAll(".ticket-breakdown-card").forEach(card => {
        const isActive =
            card.getAttribute("data-ticket-status") === activeTicketStatus;

        card.setAttribute("aria-pressed", String(isActive));
    });
}


function openTicketBreakdown(status = "all") {

    const modal = document.getElementById("ticketBreakdownModal");
    const statusFilter = document.getElementById("statusFilter");

    activeTicketStatus = status || "all";
    statusFilter.value =
        activeTicketStatus === "all" ? "" : activeTicketStatus;
    syncTicketStatusCards();
    renderTickets();
    ticketBreakdownTrigger = document.activeElement;
    renderTicketBreakdown();
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    modal.querySelector(".ticket-breakdown-close").focus();
}


function closeTicketBreakdown() {

    const modal = document.getElementById("ticketBreakdownModal");
    const trigger = ticketBreakdownTrigger;

    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    ticketBreakdownTrigger = null;

    if (trigger && typeof trigger.focus === "function") {
        trigger.focus();
    }
}

document.addEventListener("keydown", event => {
    const modal = document.getElementById("ticketBreakdownModal");

    if (event.key === "Escape" && modal.classList.contains("open")) {
        closeTicketBreakdown();
    }
});


/* RENDER */

function renderTickets() {

    const list = document.getElementById("ticketList");

    const search =
        document.getElementById("search").value
            .toLowerCase()
            .trim();

    const status =
        document.getElementById("statusFilter").value;

    const filtered = tickets.filter(ticket => {

        const matchesStatus = !status || ticket.status === status;
        const matchesSearch =
            String(ticket.id).includes(search) ||
            String(ticket.name || "").toLowerCase().includes(search) ||
            String(ticket.email || "").toLowerCase().includes(search) ||
            String(ticket.message || "").toLowerCase().includes(search);

        return matchesStatus && matchesSearch;

    });

    if (!filtered.length) {

        list.innerHTML =
            `<div class="empty">
                No support tickets found.
            </div>`;

        return;
    }

    list.innerHTML = filtered.map(ticket => {

        const active =
            selectedTicket &&
            Number(selectedTicket.id) === Number(ticket.id)
                ? "active"
                : "";

        return `
            <div
                class="ticket ${active}"
                onclick="openTicket(${ticket.id})"
            >

                <div class="ticket-top">

                    <div>
                        <div class="ticket-name">
                            #${ticket.id} - ${escapeHtml(ticket.name)}
                        </div>

                        <div class="ticket-email">
                            ${escapeHtml(ticket.email)}
                        </div>
                        ${ticket.order_id ? `<div class="ticket-order">Order #${escapeHtml(ticket.order_id)}</div>` : ""}
                    </div>

                    <span class="badge ${ticket.status}">
                        ${formatStatus(ticket.status)}
                    </span>

                </div>

                <div class="ticket-message">
                    ${escapeHtml(ticket.message)}
                </div>

            </div>
        `;

    }).join("");
}


/* SEARCH */

function filterTickets() {
    renderTickets();
}


/* OPEN TICKET */

async function openTicket(id) {

    try {

        const ticket = await apiRequest(`/admin/support/${id}`);

        if (!ticket) return;

        selectedTicket = ticket;

        renderTickets();

        const replies =
            await apiRequest(`/admin/support/${id}/replies`);

        renderConversation(ticket, replies || []);

    } catch (error) {

        console.error(error);

        alert(error.message);
    }
}


/* CONVERSATION */

function renderConversation(ticket, replies) {

    const content =
        document.getElementById("conversationContent");

    let messages = [];

    messages.push({
        message: ticket.message,
        is_customer_reply: true,
        created_at: ticket.created_at
    });

    messages = messages.concat(replies);

    content.innerHTML = `

        <div class="conversation-header">

            <h2>
                Ticket #${ticket.id}
            </h2>

            <div class="customer-info">
                <strong>${escapeHtml(ticket.name)}</strong>
                · ${escapeHtml(ticket.email)}
                ${ticket.order_id
                    ? ` · Order #${escapeHtml(ticket.order_id)}`
                    : ""}
                · ${escapeHtml(ticket.category)}
            </div>

        </div>

        <div class="messages">

            ${messages.map(message => `

                <div class="message ${
                    message.is_customer_reply
                        ? "customer"
                        : "admin"
                }">

                    <div class="message-label">
                        ${
                            message.is_customer_reply
                                ? "CUSTOMER"
                                : "SUPPORT TEAM"
                        }
                    </div>

                    <div>
                        ${escapeHtml(message.message)}
                    </div>

                    <div class="message-time">
                        ${formatDate(message.created_at)}
                    </div>

                </div>

            `).join("")}

        </div>

        <div class="reply-box">

            <textarea
                id="replyMessage"
                placeholder="Write your reply to the customer..."
            ></textarea>

            <div class="reply-actions">

                <select id="newStatus">

                    <option value="open"
                        ${ticket.status === "open" ? "selected" : ""}>
                        Open
                    </option>

                    <option value="in_progress"
                        ${ticket.status === "in_progress" ? "selected" : ""}>
                        In Progress
                    </option>

                    <option value="resolved"
                        ${ticket.status === "resolved" ? "selected" : ""}>
                        Resolved
                    </option>

                    <option value="closed"
                        ${ticket.status === "closed" ? "selected" : ""}>
                        Closed
                    </option>

                </select>

                <button onclick="updateStatus()">
                    Update Status
                </button>

                <button onclick="sendReply()">
                    Send Reply
                </button>

            </div>

        </div>
    `;
}


/* SEND REPLY */

async function sendReply() {

    if (!selectedTicket) return;

    const textarea =
        document.getElementById("replyMessage");

    const message =
        textarea.value.trim();

    if (!message) {

        alert("Please enter a reply.");

        return;
    }

    try {

        await apiRequest(
            `/admin/support/${selectedTicket.id}/replies`,
            {
                method: "POST",
                body: JSON.stringify({
                    message
                })
            }
        );

        textarea.value = "";

        await openTicket(selectedTicket.id);

        alert("Reply sent successfully.");

    } catch (error) {

        alert(error.message);
    }
}


/* UPDATE STATUS */

async function updateStatus() {

    if (!selectedTicket) return;

    const status =
        document.getElementById("newStatus").value;

    try {

        await apiRequest(
            `/admin/support/${selectedTicket.id}`,
            {
                method: "PATCH",
                body: JSON.stringify({
                    status
                })
            }
        );

        selectedTicket.status = status;

        await loadTickets();

        await openTicket(selectedTicket.id);

    } catch (error) {

        alert(error.message);
    }
}


/* LOGOUT */

function logout() {

    localStorage.removeItem("sriram-admin-token");
    localStorage.removeItem("adminToken");
    localStorage.removeItem("admin_token");
    sessionStorage.removeItem("adminToken");

    window.location.href = "admin-login.html";
}


/* HELPERS */

function formatStatus(status) {

    return String(status)
        .replace("_", " ")
        .replace(/\b\w/g, c => c.toUpperCase());
}


function formatDate(date) {

    if (!date) return "";

    return new Date(date).toLocaleString();
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* START */

if (!getToken()) {
    window.location.href = "admin-login.html?redirect=" + encodeURIComponent("admin-support.html");
} else {
    loadTickets();
}

</script>
